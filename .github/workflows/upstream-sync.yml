name: Upstream Sync

on:
  schedule:
    - cron: '0 4 * * *' # Daily at 4:00 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: plus-dev
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check Upstream Changes
        id: upstream
        run: |
          git remote add upstream https://github.com/NuvioMedia/NuvioTV.git
          git fetch upstream dev --tags

          UPSTREAM_HEAD=$(git rev-parse upstream/dev)
          COMMON_ANCESTOR=$(git merge-base HEAD upstream/dev)

          echo "upstream_head=$UPSTREAM_HEAD" >> "$GITHUB_OUTPUT"
          echo "common_ancestor=$COMMON_ANCESTOR" >> "$GITHUB_OUTPUT"

          if [ "$UPSTREAM_HEAD" != "$COMMON_ANCESTOR" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "New commits detected in upstream/dev."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Already up-to-date with upstream/dev."
          fi

      - name: Create sync branch and pull request
        if: steps.upstream.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_HEAD: ${{ steps.upstream.outputs.upstream_head }}
        run: |
          sha12="${UPSTREAM_HEAD:0:12}"
          branch="codex/upstream-${sha12}"

          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "Branch ${branch} already exists on origin."
          else
            git branch -f "${branch}" upstream/dev
            git push origin "${branch}"
          fi

          existing_pr=$(gh pr list --head "${branch}" --base plus-dev --state open --json number --jq '.[0].number')
          if [[ -n "${existing_pr}" ]]; then
            echo "Pull request for ${branch} already exists (#${existing_pr})."
            exit 0
          fi

          gh pr create \
            --base plus-dev \
            --head "${branch}" \
            --title "chore(sync): upstream/dev (${sha12})" \
            --body "Automated upstream sync from NuvioMedia/NuvioTV@dev (${UPSTREAM_HEAD}).

          This PR exposes any merge conflicts for review. It does not merge or push to plus-dev automatically.

          GitHub bot-created pull requests do not automatically start pull_request workflows. After resolving conflicts on the integration branch, manually dispatch PR Full Debug Build on that branch and require its full unit-test and APK build result before merging."
