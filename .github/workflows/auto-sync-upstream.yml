name: Auto-Sync Upstream & Release

on:
  schedule:
    - cron: '0 4 * * *' # Daily at 4 AM UTC
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force release build even if no new upstream commits'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  check-and-sync:
    name: Sync Upstream & Trigger Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: plus-dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Upstream
        run: |
          git remote add upstream https://github.com/NuvioMedia/NuvioTV.git || true
          git fetch upstream dev --tags

      - name: Check for new upstream commits
        id: check
        run: |
          UPSTREAM_HEAD=$(git rev-parse upstream/dev)
          COMMON_ANCESTOR=$(git merge-base HEAD upstream/dev)
          if [ "$UPSTREAM_HEAD" = "$COMMON_ANCESTOR" ]; then
            echo "No new upstream commits found."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream commits found!"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt merge
        if: steps.check.outputs.has_updates == 'true'
        id: merge
        run: |
          if git merge upstream/dev --no-edit -m "chore(upstream): sync upstream/dev into plus-dev"; then
            echo "Merge succeeded cleanly!"
            git push origin plus-dev
            echo "merge_success=true" >> "$GITHUB_OUTPUT"
          else
            echo "Merge conflict encountered!"
            git merge --abort
            echo "merge_success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Alert on conflict
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.merge_success == 'false'
        run: |
          gh issue create --repo ${{ github.repository }} \
            --title "⚠️ Upstream Merge Conflict in plus-dev" \
            --body "Automated sync encountered conflicts when merging upstream/dev into plus-dev. Please pull and resolve manually."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Trigger Release Workflow
        if: (steps.merge.outputs.merge_success == 'true') || (inputs.force_build == true)
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.9.2")
          new_tag="${latest_tag}-plus.$(date +%Y%m%d%H%M)"
          echo "Triggering release with tag ${new_tag}"
          gh workflow run fork-release.yml \
            --repo ${{ github.repository }} \
            --ref plus-dev \
            -f tag="${new_tag}" \
            -f title="Nuvio+ ${new_tag}"
        env:
          GH_TOKEN: ${{ github.token }}
