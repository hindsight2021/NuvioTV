name: "Nuvio Plus Release"

on:
  schedule:
    - cron: '0 4 * * *' # Daily check at 4 AM UTC
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force release build even if no upstream changes'
        required: false
        type: boolean
        default: true
      tag:
        description: 'Release tag'
        required: false
        type: string
        default: '0.9.2-plus.1'

permissions:
  contents: write
  issues: write

concurrency:
  group: nuvioplus-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'nuvioplus' }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'nuvio2026plus' }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'nuvio2026plus' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check and Sync Upstream
        id: sync
        run: |
          git remote add upstream https://github.com/NuvioMedia/NuvioTV.git || true
          git fetch upstream dev --tags

          UPSTREAM_HEAD=$(git rev-parse upstream/dev)
          COMMON_ANCESTOR=$(git merge-base HEAD upstream/dev)

          if [ "$UPSTREAM_HEAD" != "$COMMON_ANCESTOR" ]; then
            echo "New upstream commits found. Attempting merge..."
            if git merge upstream/dev --no-edit -m "chore(upstream): sync upstream/dev into fork"; then
              echo "Merge clean!"
              git push origin HEAD || true
              echo "has_updates=true" >> "$GITHUB_OUTPUT"
            else
              echo "Merge conflict detected!"
              git merge --abort
              gh issue create --repo ${{ github.repository }} \
                --title "⚠️ Upstream Merge Conflict in Nuvio+" \
                --body "Automated sync encountered conflicts when merging upstream/dev. Please resolve manually."
              exit 1
            fi
          else
            echo "No new upstream commits."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine if build is needed
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_build }}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.sync.outputs.has_updates }}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No build needed today."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.gate.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: steps.gate.outputs.should_build == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Keystore & Properties
        if: steps.gate.outputs.should_build == 'true'
        run: |
          keystore_path="${RUNNER_TEMP}/nuvioplus.jks"
          if [[ -n "${RELEASE_KEYSTORE_BASE64}" ]]; then
            printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          else
            echo "Generating fallback build keystore..."
            keytool -genkeypair -v -keystore "${keystore_path}" -storepass nuvio2026plus -alias nuvioplus -keypass nuvio2026plus -dname "CN=Nuvio Plus,O=Nuvio,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

          if [[ -n "${LOCAL_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          else
            touch local.properties
          fi

          set_prop() {
            local key="$1"
            local val="$2"
            sed -i -E "/^[[:space:]]*${key}[[:space:]]*=/d" local.properties
            printf '\n%s=%s\n' "${key}" "${val}" >> local.properties
          }

          set_prop NUVIO_RELEASE_STORE_FILE "${keystore_path}"
          set_prop NUVIO_RELEASE_KEY_ALIAS "${RELEASE_KEY_ALIAS}"
          set_prop NUVIO_RELEASE_KEY_PASSWORD "${RELEASE_KEY_PASSWORD}"
          set_prop NUVIO_RELEASE_STORE_PASSWORD "${RELEASE_STORE_PASSWORD}"
          set_prop GITHUB_OWNER "hindsight2021"
          set_prop GITHUB_REPO "NuvioTV"
          set_prop NUVIO_SUPABASE_URL "https://api.nuvio.tv"
          set_prop NUVIO_SUPABASE_ANON_KEY "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI"

          # Defaults for optional integrations
          grep -Eq "^[[:space:]]*TRAKT_CLIENT_ID[[:space:]]*=" local.properties || set_prop TRAKT_CLIENT_ID ""
          grep -Eq "^[[:space:]]*TRAKT_CLIENT_SECRET[[:space:]]*=" local.properties || set_prop TRAKT_CLIENT_SECRET ""
          grep -Eq "^[[:space:]]*SIMKL_CLIENT_ID[[:space:]]*=" local.properties || set_prop SIMKL_CLIENT_ID ""
          grep -Eq "^[[:space:]]*SIMKL_APP_NAME[[:space:]]*=" local.properties || set_prop SIMKL_APP_NAME "nuvio"

      - name: Build full release APKs
        if: steps.gate.outputs.should_build == 'true'
        run: ./gradlew :app:assembleFullRelease --stacktrace

      - name: Upload build artifacts
        if: steps.gate.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nuvioplus-apks
          path: app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error

      - name: Determine Release Tag & Title
        if: steps.gate.outputs.should_build == 'true'
        id: meta
        run: |
          custom_tag="${{ inputs.tag }}"
          if [[ -n "${custom_tag}" ]]; then
            tag="${custom_tag}"
          else
            tag="0.9.2-plus.${{ github.run_number }}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "title=Nuvio+ ${tag}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.gate.outputs.should_build == 'true'
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_TITLE: ${{ steps.meta.outputs.title }}
        run: |
          mapfile -t apks < <(find app/build/outputs/apk/full/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          if (( ${#apks[@]} == 0 )); then
            echo "No release APKs found!" >&2
            exit 1
          fi

          args=(
            "${RELEASE_TAG}"
            --title "${RELEASE_TITLE}"
            --latest
            --notes "### 🚀 Nuvio+ Custom Release (${RELEASE_TAG})
- **Side-by-side on Nvidia Shield**: Package ID \`com.nuvio.tv.plus\` (installs alongside official Nuvio).
- **Official Nuvio Account**: Connects to \`api.nuvio.tv\` so your profiles, add-ons, and home catalogs load seamlessly.
- **Local NAS & Storage Support**: Direct playback of local and Shield mounted network storage (/storage).
- **Episode & Show Long-Press Context Menu**:
  - 🎲 **Play Random Episode**: Instantly picks and plays a random episode of the series.
  - 📺 **Continuous Show Channels**: Stream all episodes continuously in Shuffle or Chronological Binge order.
- **1-Click Watchlist**: Toggle Trakt and Simkl watchlist from the context menu.
- **Play Next & Playlist Builder**: Add episodes to queue, reorder, and save playlists.
- **Startup Chime**: Sleek modern sonic chime on launch.
- **Automated OTA Updates**: Updates directly on your TV from hindsight2021/NuvioTV."
          )

          # Delete existing release with same tag if present
          gh release delete "${RELEASE_TAG}" --yes || true
          git tag -d "${RELEASE_TAG}" 2>/dev/null || true
          git push origin ":refs/tags/${RELEASE_TAG}" 2>/dev/null || true

          gh release create "${args[@]}" "${apks[@]}"
